<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integra | Chat com a Eva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Cores estimadas a partir do Figma: troque pelos valores exatos, se precisar */
  :root{
    --navy:#0F2D40; --teal:#1F6285; --blue:#0B3DF2; --cyan:#31B8E6;
    --mist:#E6F0F6; --white:#fff; --ink:#0F2D40;
    --font:"Manrope","Segoe UI",system-ui,sans-serif;
  }
  body{margin:0;font-family:var(--font);color:var(--ink)}
  .demo{padding:24px}

  #ev-btn{position:fixed;right:20px;bottom:20px;width:64px;height:64px;border:2px solid var(--cyan);border-radius:50%;background:var(--navy);color:#fff;font:800 15px var(--font);cursor:pointer;z-index:9998}
  #ev-btn::after{content:"";position:absolute;right:4px;top:4px;width:12px;height:12px;border-radius:50%;background:#3ddc84;border:2px solid var(--navy)}

  #ev-box{position:fixed;right:20px;bottom:96px;width:390px;max-width:calc(100vw - 24px);height:580px;max-height:calc(100vh - 116px);display:none;flex-direction:column;background:var(--white);border-radius:22px;overflow:hidden;font-family:var(--font);box-shadow:0 12px 40px rgba(15,45,64,.35);z-index:9999}
  #ev-head{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:14px 16px}
  #ev-logo{font-weight:800;font-size:22px;letter-spacing:-.3px}
  #ev-logo img{display:block;height:28px}
  #ev-sub{margin-left:auto;font-size:12px;color:#bcd3e0;display:flex;align-items:center;gap:6px}
  #ev-sub::before{content:"";width:8px;height:8px;border-radius:50%;background:#3ddc84}
  #ev-close{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:0 0 0 6px}

  #ev-msgs{flex:1;overflow-y:auto;padding:0 14px 12px 0;display:flex;flex-direction:column;gap:10px;background:#fff}
  .ev-tab{align-self:flex-start;margin:14px 0 2px;background:var(--teal);color:#fff;font-weight:800;font-size:13px;letter-spacing:.2px;text-transform:uppercase;padding:9px 20px 9px 16px;border-radius:0 14px 14px 0}
  .ev-tab b{color:#fff}
  .ev-m{max-width:86%;padding:11px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .ev-bot{align-self:flex-start;margin-left:14px;background:var(--navy);color:#fff;border-radius:18px 18px 18px 4px}
  .ev-bot a{color:var(--cyan)}
  .ev-user{align-self:flex-end;background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px;font-weight:600}
  .ev-dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--cyan);animation:ev-b 1s infinite}
  .ev-dots span:nth-child(2){animation-delay:.15s}.ev-dots span:nth-child(3){animation-delay:.3s}
  @keyframes ev-b{0%,60%,100%{opacity:.3}30%{opacity:1}}

  #ev-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--mist);scrollbar-width:thin}
  #ev-chips button{flex:none;border:1.5px solid var(--teal);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font:600 13px var(--font);cursor:pointer;white-space:nowrap}
  #ev-chips button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

  #ev-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #d5e1e9;background:#fff}
  #ev-in{flex:1;min-width:0;border:1.5px solid #c3d3de;border-radius:10px;background:#f6f9fb;padding:11px 12px;font:14px var(--font);color:var(--ink)}
  #ev-send{border:0;border-radius:10px;background:var(--blue);color:#fff;font:800 13px var(--font);padding:0 18px;cursor:pointer;text-transform:uppercase}
  #ev-foot{padding:0 14px 10px;font-size:11px;color:#5d7686;background:#fff}
  #ev-foot a{color:var(--blue)}

  #ev-btn:focus-visible,#ev-close:focus-visible,#ev-chips button:focus-visible,#ev-send:focus-visible,#ev-in:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  @media (max-width:480px){#ev-box{right:12px;left:12px;width:auto;bottom:92px}}
  @media (prefers-reduced-motion:reduce){.ev-dots span{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="demo">Página de exemplo do site. O chat da Eva fica no canto inferior direito.</div>

<button id="ev-btn" aria-label="Abrir chat com a Eva" aria-expanded="false">EVA</button>
<section id="ev-box" role="dialog" aria-label="Chat com a Eva">
  <header id="ev-head">
    <div id="ev-logo"><!-- Para usar o logo do site: <img src="logo-integra.svg" alt="Integra"> -->Integra</div>
    <div id="ev-sub">Eva · sua IA</div>
    <button id="ev-close" aria-label="Fechar chat">×</button>
  </header>
  <div id="ev-msgs" aria-live="polite"></div>
  <div id="ev-chips" aria-label="Atalhos"></div>
  <div id="ev-form">
    <input id="ev-in" placeholder="Digite sua mensagem" autocomplete="off" aria-label="Mensagem">
    <button id="ev-send">Enviar</button>
  </div>
  <div id="ev-foot">Ao conversar, você concorda com a <a href="#" id="ev-priv" target="_blank" rel="noopener">Declaração de Privacidade</a>.</div>
</section>

<script>
  const API = "";                       // se o chat ficar em outro domínio: "https://api.seusite.com.br"
  const PRIVACY_URL = "#";              // link da Declaração de Privacidade do site
  const ATALHOS_PADRAO = ["Conhecer a Eva", "Áreas de atuação", "Quero uma demonstração", "Abrir chamado", "Sou cliente", "Trabalhe conosco"];

  const $ = id => document.getElementById(id);
  const box = $("ev-box"), btn = $("ev-btn"), msgs = $("ev-msgs"), input = $("ev-in"), chips = $("ev-chips");
  $("ev-priv").href = PRIVACY_URL;

  let sid;
  try { sid = localStorage.getItem("ev-sid"); if (!sid) { sid = Math.random().toString(36).slice(2, 12); localStorage.setItem("ev-sid", sid); } }
  catch (e) { sid = Math.random().toString(36).slice(2, 12); }

  function add(text, who) {
    const d = document.createElement("div");
    d.className = "ev-m ev-" + who;
    text.split(/(https?:\/\/[^\s]*[^\s.,;:!?)])/g).forEach(part => {
      if (/^https?:\/\//.test(part)) {
        const a = document.createElement("a"); a.href = part; a.target = "_blank"; a.rel = "noopener"; a.textContent = part; d.appendChild(a);
      } else d.appendChild(document.createTextNode(part));
    });
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function typing() {
    const d = document.createElement("div"); d.className = "ev-m ev-bot ev-dots";
    d.innerHTML = "<span></span><span></span><span></span>";
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
  }
  async function send(text) {
    text = (text || input.value).trim();
    if (!text) return;
    input.value = "";
    add(text, "user");
    const t = typing();
    try {
      const r = await fetch(API + "/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({message: text, session_id: sid})});
      const data = await r.json();
      t.remove(); add(data.reply || "Não consegui responder agora. Tente novamente.", "bot");
    } catch (e) { t.remove(); add("Não consegui falar com o servidor. Tente novamente em instantes.", "bot"); }
  }
  function setChips(list) {
    chips.innerHTML = "";
    list.forEach(txt => { const b = document.createElement("button"); b.textContent = txt; b.onclick = () => send(txt); chips.appendChild(b); });
  }
  async function start() {
    const tab = document.createElement("div"); tab.className = "ev-tab"; tab.textContent = "Olá, me chamo Eva, sua IA"; msgs.appendChild(tab);
    let greeting = "Estou aqui para impulsionar o crescimento do seu negócio. Como posso ajudar?", atalhos = ATALHOS_PADRAO;
    try {
      const g = await (await fetch(API + "/greeting")).json();
      greeting = g.reply.replace(/^Olá, me chamo [^!]*!\s*/, ""); atalhos = g.atalhos || atalhos;
    } catch (e) {}
    add(greeting, "bot"); setChips(atalhos);
  }
  function toggle(open) {
    box.style.display = open ? "flex" : "none";
    btn.setAttribute("aria-expanded", open);
    if (open) { if (!msgs.children.length) start(); input.focus(); }
  }
  btn.onclick = () => toggle(box.style.display !== "flex");
  $("ev-close").onclick = () => toggle(false);
  $("ev-send").onclick = () => send();
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
